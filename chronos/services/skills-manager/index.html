<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Скиллы</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <h1>Скиллы</h1><span class="total" id="total"></span>
    <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="sr">Найти скилл</span><input id="filter" class="input" placeholder="Найти скилл по имени или описанию" title="Поиск: Ctrl K или /" autocomplete="off" spellcheck="false"><kbd>Ctrl K</kbd></label>
    <span class="grow"></span>
    <button class="btn ghost icon" id="refresh" title="Перечитать списки скиллов" aria-label="Обновить"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
    <button class="btn" id="add" title="Найти и установить скилл из каталога skills.sh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span class="lbl">Из skills.sh</span></button>
    <button class="btn primary" id="create"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">Новый скилл</span></button>
    <button class="btn ghost icon close" id="closeApp" title="Закрыть (Esc)" aria-label="Закрыть менеджер"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </header>
  <nav id="nav" aria-label="Расположения скиллов"></nav>
  <main id="main"><div class="empty">Загрузка…</div></main>
  <aside id="detail" hidden aria-label="Выбранный скилл"></aside>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const q=new URLSearchParams(location.hash.slice(1)),R=document.documentElement;
if(q.get('theme')==='dark')R.classList.add('dark');if(q.get('olympus')==='1')R.classList.add('olympus');
for(const k of ['bg','fg','muted','border','panel','accent','primary','primary-fg','radius']){const v=q.get(k);if(v)R.style.setProperty('--t3-'+k,v)}
const api=async(p,body)=>{const r=await fetch(p,body?{method:'POST',headers:{'content-type':'application/json','x-oly':'1'},body:JSON.stringify(body)}:{});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.statusText);return j};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const LSG=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},LSS=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const NAME_RE=/^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$/;
const plural=(n,a,b,c)=>{const m10=n%10,m100=n%100;return n+' '+(m10===1&&m100!==11?a:m10>=2&&m10<=4&&(m100<10||m100>=20)?b:c)};
const fmtDate=ms=>ms?new Date(ms).toLocaleString('ru-RU',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';
const fmtDay=ms=>ms?new Date(ms).toLocaleDateString('ru-RU',{day:'numeric',month:'short',...(new Date(ms).getFullYear()!==new Date().getFullYear()?{year:'numeric'}:{})}):'';
const fmtSize=b=>b<1024?b+' Б':b<1048576?(b/1024).toFixed(1).replace('.',',')+' КБ':(b/1048576).toFixed(1).replace('.',',')+' МБ';
const sv=d=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+d+'</svg>';
const I={
 all:sv('<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>'),
 star:sv('<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>'),
 starOn:'<svg viewBox="0 0 24 24" aria-hidden="true" class="fill"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
 ssh:sv('<rect x="3" y="4" width="18" height="7" rx="1"/><rect x="3" y="13" width="18" height="7" rx="1"/><path d="M7 7.5h.01M7 16.5h.01"/>'),
 proj:sv('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'),
 pc:sv('<rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 20h8M12 16v4"/>'),
 x:sv('<path d="M18 6 6 18M6 6l12 12"/>'),
 back:sv('<path d="M15 6l-6 6 6 6"/>'),
 chev:sv('<path d="m9 6 6 6-6 6"/>'),
 sync:sv('<path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 21v-5h5M21 3v5h-5"/>'),
 down:sv('<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>'),
 copy:sv('<rect x="8" y="8" width="13" height="13" rx="1"/><path d="M16 8V5a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h3"/>'),
 folder:sv('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'),
 trash:sv('<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>'),
 check:sv('<path d="M20 6 9 17l-5-5"/>'),
 doc:sv('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>'),
 empty:sv('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>'),
 edit:sv('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>'),
 eye:sv('<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),
 save:sv('<path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v5h8V3M7 21v-7h10v7"/>'),
 warn:sv('<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/>')};
const AGENT={claude:'Claude',codex:'Codex',agents:'.agents'};

let LOCS=[],view='overview',LIST={},HASH={},HERR={},HOSTS={},UP=null,upBusy=false,SEL=new Set();
let skillMode=LSG('oly-skills-layout-v4','list'),skillState='all',skillAgent='all',onlyFavorites=false;
let favorites=new Set(LSG('oly-skills-favorites',[]));
let navOpen=LSG('oly-skills-nav-open',{}),DET=null,SK={};
const busyLoc=new Set();
function toast(msg,err){const d=document.createElement('div');if(err)d.className='err';d.textContent=msg;$('#toast').appendChild(d);setTimeout(()=>d.remove(),err?8000:4000)}
const locById=id=>LOCS.find(l=>l.id===id);
const hostsOf=()=>[...new Set(LOCS.filter(l=>l.kind==='ssh').map(l=>l.host))];
const shortLabel=l=>l.kind==='local'&&!l.project?l.label:l.label.split(' · ').pop();
const gkey=l=>l.kind==='ssh'?l.host:l.project||'Этот компьютер';
const placeOf=l=>l.kind==='ssh'?'Сервер '+l.host:l.project?'Проект '+l.project:'Этот компьютер';

/* ---------- data ---------- */
async function loadLocal(l){busyLoc.add(l.id);try{LIST[l.id]=await api('/api/skills?loc='+encodeURIComponent(l.id))}catch(e){LIST[l.id]={skills:[],exists:false,error:e.message}}busyLoc.delete(l.id);paint();
 api('/api/hashes?loc='+encodeURIComponent(l.id)).then(h=>{HASH[l.id]=h;delete HERR[l.id];paint()}).catch(e=>{HERR[l.id]=e.message;paint()})}
async function loadHost(h,force){HOSTS[h]={s:'load'};paint();
 try{const data=await api('/api/host?host='+encodeURIComponent(h)+(force?'&refresh=1':''));for(const id in data)LIST[id]=data[id];HOSTS[h]={s:'ok'};
  const keep=LSG('oly-skills-hosts',[]);if(!keep.includes(h))LSS('oly-skills-hosts',keep.concat(h));paint();
  for(const l of LOCS.filter(x=>x.host===h&&LIST[x.id]&&LIST[x.id].exists)){try{HASH[l.id]=await api('/api/hashes?loc='+encodeURIComponent(l.id)+(force?'&refresh=1':''));force=false}catch(e){HERR[l.id]=e.message}paint()}}
 catch(e){HOSTS[h]={s:'err',e:e.message};paint();if(view!=='overview')toast(e.message,true)}}
async function loadLocs(refresh){LOCS=await api('/api/locations'+(refresh?'?refresh=1':''));
 await Promise.all(LOCS.filter(l=>l.kind==='local'&&l.exists!==false).map(loadLocal));
 for(const h of LSG('oly-skills-hosts',[]))if(hostsOf().includes(h))loadHost(h,refresh)}
async function refreshLocs(ids){for(const k in SK)if(ids.some(id=>k.startsWith(id+'|')))delete SK[k];const hosts=new Set();for(const id of ids){const l=locById(id);if(!l)continue;if(l.kind==='ssh')hosts.add(l.host);else await loadLocal(l)}for(const h of hosts)await loadHost(h,true)}
const hashOf=(id,name,off)=>HASH[id]&&HASH[id][(off?'!':'')+name];

/* ---------- index of skills across locations ---------- */
let IDX=null,CACHE=false;
function index(){if(CACHE&&IDX)return IDX;const map=new Map();
 for(const l of LOCS){const d=LIST[l.id];if(!d||!d.skills)continue;
  for(const s of d.skills){let e=map.get(s.name);if(!e){e={name:s.name,desc:s.description,cells:{}};map.set(s.name,e)}if(!e.desc)e.desc=s.description;
   const prev=e.cells[l.id];if(!prev||prev.disabled&&!s.disabled)e.cells[l.id]={disabled:s.disabled,mtime:s.mtime}}}
 for(const e of map.values()){const cnt={},newest={};for(const id in e.cells){const c=e.cells[id];c.hash=hashOf(id,e.name,c.disabled);if(c.hash){cnt[c.hash]=(cnt[c.hash]||0)+1;newest[c.hash]=Math.max(newest[c.hash]||0,c.mtime||0)}}
  e.versions=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||newest[b]-newest[a]);for(const id in e.cells){const c=e.cells[id];c.v=c.hash?e.versions.indexOf(c.hash):(HERR[id]?'?':0)}}
 if(CACHE)IDX=map;return map}
function columns(){return LOCS.filter(l=>{const d=LIST[l.id];return d&&d.exists&&(l.kind!=='local'||!l.project||d.skills.length)})}
const locOrder=id=>{const i=LOCS.findIndex(l=>l.id===id);return i<0?1e9:i};
const enabledIn=e=>Object.keys(e.cells).filter(id=>!e.cells[id].disabled);
function upState(e){const up=UP&&UP[e.name];if(!up)return UP&&up===null?'none':'';if(!up.hash)return '';if(!sameSkill(up,e))return 'namesake';return Object.values(e.cells).some(c=>c.hash&&c.hash!==up.hash)?'stale':'ok'}

/* ---------- nav ---------- */
const countOf=l=>{const d=LIST[l.id];return d&&d.skills?d.skills.filter(s=>!s.disabled).length:null};
function navItem(v,icon,label,n,cur,extra){return `<button class="loc${extra||''}" data-view="${esc(v)}" aria-current="${cur}"><span class="ic">${icon}</span><span class="lbl">${esc(label)}</span><span class="n">${n==null?'':n}</span></button>`}
function navHtml(){const idx=index(),fav=[...favorites].filter(n=>idx.has(n)).length;
 let h=navItem('overview',I.all,'Все скиллы',idx.size||'',view==='overview'&&!onlyFavorites)+navItem('fav',I.star,'Избранное',fav||'',view==='overview'&&onlyFavorites);
 const g={};for(const l of LOCS)(g[l.group]=g[l.group]||[]).push(l);
 for(const[group,ls]of Object.entries(g)){h+=`<div class="group">${esc(group)}</div>`;
  if(!ls.some(l=>l.project||l.host)){for(const l of ls){const n=countOf(l),d=LIST[l.id];h+=navItem(l.id,I.pc,shortLabel(l),n,view===l.id,(d&&!d.exists)||(l.exists===false&&!n)?' dim':'')}continue}
  const subs=new Map();for(const l of ls){const d=LIST[l.id];if(l.project&&l.exists===false&&!(d&&d.skills.length))continue;const k=l.project||l.host;if(!subs.has(k))subs.set(k,[]);subs.get(k).push(l)}
  if(!subs.size){h+='<div class="note">Папок со скиллами в проектах пока нет. Установите скилл в проект через «Копировать в…».</div>';continue}
  for(const[k,arr]of subs){const host=arr[0].host,hs=host&&HOSTS[host],open=navOpen[k]??arr.some(l=>l.id===view);
   const total=arr.reduce((s,l)=>s+(countOf(l)||0),0),loaded=!host||hs&&hs.s==='ok';
   const st=host?`<span class="st" data-s="${hs?hs.s:''}" title="${esc(hs&&hs.e?hs.e:hs&&hs.s==='ok'?'Подключено':hs&&hs.s==='load'?'Подключение…':'Не загружено — раскройте, чтобы подключиться по SSH')}"></span>`:'';
   h+=`<div class="sub" data-open="${open}"><button class="subh" data-sub="${esc(k)}" data-host="${esc(host||'')}" aria-expanded="${open}"><span class="tw">${I.chev}</span><span class="ic">${host?I.ssh:I.proj}</span><span class="lbl">${esc(k)}</span>${arr[0].t3?'<span class="tag">T3</span>':''}${st}<span class="n">${loaded&&total?total:''}</span></button>`;
   if(open)h+='<div class="subl">'+arr.map(l=>{const n=countOf(l),d=LIST[l.id];return navItem(l.id,'',l.short||shortLabel(l),n,view===l.id,(d&&!d.exists)||(l.exists===false&&!n)?' dim':'')}).join('')+'</div>';
   h+='</div>'}}
 $('#nav').innerHTML=h}

/* ---------- views ---------- */
let paintQ=false;function paint(){if(paintQ)return;paintQ=true;requestAnimationFrame(()=>{paintQ=false;IDX=null;CACHE=true;try{$('#total').textContent=index().size||'';navHtml();if(!document.querySelector('.overlay[data-modal]'))render()}finally{CACHE=false;IDX=null}})}
function setView(v){if(v==='fav'){view='overview';onlyFavorites=true}else{view=v;onlyFavorites=false}SEL.clear();
 const l=locById(view);if(l&&l.kind==='ssh'&&!(HOSTS[l.host]&&HOSTS[l.host].s==='ok'))loadHost(l.host);$('#main').scrollTop=0;paint()}
function render(){const m=$('#main'),sc=m.scrollTop;if(view==='overview'){if(skillMode==='matrix')renderMatrix();else renderList()}else renderLoc();m.scrollTop=sc;renderDetail()}
const match=(name,desc)=>{const f=$('#filter').value.trim().toLowerCase();return !f||f.split(/\s+/).every(t=>(name+' '+(desc||'')).toLowerCase().includes(t))};
function skillPass(name,cells,versions=0){
 if(onlyFavorites&&!favorites.has(name))return false;
 const entries=Object.entries(cells).filter(([id])=>skillAgent==='all'||locById(id)?.agent===skillAgent||id.toLowerCase().includes(skillAgent));
 if(!entries.length)return false;
 if(skillState==='enabled'&&!entries.some(([,c])=>!c.disabled))return false;
 if(skillState==='disabled'&&!entries.some(([,c])=>c.disabled))return false;
 if(skillState==='different'&&versions<2)return false;
 return true}
const seg=(name,opts,cur,label)=>`<div class="seg" role="group" aria-label="${esc(label)}">${opts.map(([v,l])=>`<button data-seg="${name}" data-v="${v}" aria-pressed="${cur===v}">${l}</button>`).join('')}</div>`;
function head(title,count,sub,extra){
 const filters=seg('state',[['all','Все'],['enabled','Включённые'],['disabled','Отключённые'],['different','Разные версии']],skillState,'Состояние')+
  (view==='overview'?`<label class="sel"><span class="sr">Агент</span><select class="input" data-skill-filter="agent">${[['all','Все агенты'],['claude','Claude'],['codex','Codex'],['agents','Общие (.agents)']].map(([v,l])=>`<option value="${v}"${skillAgent===v?' selected':''}>${l}</option>`).join('')}</select>${I.chev}</label>`:'')+
  '<span class="grow"></span>'+(view==='overview'?seg('layout',[['list','Список'],['matrix','Сравнение копий']],skillMode,'Вид'):'');
 return `<div class="bar"><div class="bar-h"><h2>${esc(title)}</h2><span class="cnt">${count}</span><span class="grow"></span>${extra||''}</div>${sub||''}<div class="bar-f">${SEL.size?bulkHtml():filters}</div></div>`}
function bulkHtml(){const n=`<span class="selc">Выбрано: ${SEL.size}</span>`;
 if(view==='overview')return n+`<button class="btn sm" data-act="bcopy-o">${I.copy}Копировать в…</button><button class="btn sm" data-act="bsync">${I.sync}Синхронизировать</button><span class="grow"></span><button class="btn ghost sm" data-act="unsel">Снять выбор</button>`;
 const cur=locById(view),sel=(LIST[view]?.skills||[]).filter(s=>SEL.has(s.name+'|'+(s.disabled?1:0)));
 return n+`<button class="btn sm" data-act="bcopy">${I.copy}Копировать в…</button>${sel.some(s=>!s.disabled)?'<button class="btn sm" data-act="boff">Отключить</button>':''}${sel.some(s=>s.disabled)?'<button class="btn sm" data-act="bon">Включить</button>':''}<button class="btn sm danger" data-act="bdel">${I.trash}Удалить</button><span class="grow"></span><button class="btn ghost sm" data-act="unsel">Снять выбор</button>`}
const upBtn=()=>`<button class="btn ghost sm" data-act="upcheck"${upBusy?' disabled':''} title="Сравнить установленные скиллы с каталогом skills.sh">${I.down}${upBusy?'Проверяю…':'Проверить обновления'}</button>`;
function hostsNote(){const hs=hostsOf().filter(h=>!HOSTS[h]||HOSTS[h].s==='err');if(!hs.length)return '';
 return `<div class="note-line">${I.ssh}<span>${hs.length===1?'Сервер':'Серверы'} ${hs.map(esc).join(', ')} ${hs.length===1?'не загружен':'не загружены'} — их скиллы не показаны.</span><button class="btn ghost sm" data-act="allhosts">Подключить</button></div>`}
function chips(e){const by={};for(const id of Object.keys(e.cells).sort((a,b)=>locOrder(a)-locOrder(b))){const l=locById(id);if(!l)continue;const a=AGENT[l.agent]||l.short||'?';(by[a]=by[a]||[]).push({l,c:e.cells[id]})}
 return Object.entries(by).map(([a,arr])=>{const off=arr.every(x=>x.c.disabled),diff=arr.some(x=>x.c.v&&x.c.v!=='?');
  return `<span class="chip${off?' off':''}${diff?' diff':''}" title="${esc(arr.map(x=>x.l.label+(x.c.disabled?' · отключён':'')).join('\n'))}">${esc(a)}${arr.length>1?`<b>${arr.length}</b>`:''}</span>`}).join('')}
function badges(e){const vn=e.versions.length,u=upState(e);let h='';
 if(vn>1)h+=`<span class="badge warn" title="Копии отличаются содержимым">${plural(vn,'версия','версии','версий')}</span>`;
 if(u==='stale')h+='<span class="badge acc" title="В skills.sh есть более новая версия">обновление</span>';else if(u==='ok')h+='<span class="badge ok" title="Совпадает с каталогом skills.sh">skills.sh</span>';
 return h}
const isCur=n=>DET&&DET.name===n;
function emptyHtml(t,p,btn){return `<div class="empty"><span class="tile">${I.empty}</span><b>${t}</b>${p?`<p>${p}</p>`:''}${btn||''}</div>`}

function renderList(){const idx=index(),all=[...idx.values()];
 const rows=all.filter(e=>match(e.name,e.desc)&&skillPass(e.name,e.cells,e.versions.length)).sort((a,b)=>Number(favorites.has(b.name))-Number(favorites.has(a.name))||a.name.localeCompare(b.name));
 for(const n of[...SEL])if(!idx.has(n))SEL.delete(n);
 const allSel=rows.length&&rows.every(e=>SEL.has(e.name));
 let h=head(onlyFavorites?'Избранное':'Все скиллы',rows.length===all.length?rows.length:rows.length+' из '+all.length,hostsNote(),upBtn());
 if(!LOCS.length||!all.length&&[...busyLoc].length){$('#main').innerHTML=h+'<div class="list">'+skel(6)+'</div>';return}
 if(!rows.length){$('#main').innerHTML=h+emptyHtml(all.length?(onlyFavorites&&!favorites.size?'В избранном пока пусто':'Ничего не найдено'):'Скиллов пока нет',all.length?(onlyFavorites&&!favorites.size?'Отметьте скилл звёздочкой, и он появится здесь.':'Измените запрос или фильтры.'):'Создайте скилл или установите его из skills.sh.');return}
 h+=`<div class="list" role="listbox" aria-label="Скиллы"><div class="lhead"><input type="checkbox" class="ck" data-selall="o"${allSel?' checked':''} aria-label="Выбрать все"><span>Скилл</span><span class="grow"></span><span class="lh-places">Где установлен</span><span class="favh"></span></div>`+rows.map(e=>{const on=enabledIn(e).length;
  return `<div class="row${on?'':' off'}${isCur(e.name)?' cur':''}" data-open="${esc(e.name)}" role="option" aria-selected="${isCur(e.name)}" data-sel="${SEL.has(e.name)}"><input type="checkbox" class="ck" data-sel="${esc(e.name)}"${SEL.has(e.name)?' checked':''} aria-label="Выбрать ${esc(e.name)}"><div class="txt"><div class="name"><span>${esc(e.name)}</span>${on?'':'<span class="badge off">отключён</span>'}${badges(e)}</div><div class="desc">${esc(e.desc||'Описание отсутствует')}</div></div><div class="places">${chips(e)}</div><button class="fav" data-favorite="${esc(e.name)}" aria-pressed="${favorites.has(e.name)}" aria-label="${favorites.has(e.name)?'Убрать из избранного':'В избранное'}" title="${favorites.has(e.name)?'Убрать из избранного':'В избранное'}">${favorites.has(e.name)?I.starOn:I.star}</button></div>`}).join('')+'</div>';
 $('#main').innerHTML=h}

 return{fm,body:t.slice(m[0].length)}}

<script>
if (parent !== window) {
  const enableEnglish = async event => {
    if (event.source !== parent || event.data?.type !== "chronos:ui-language" ||
        event.data.language !== "en" || !["t3code://app", location.origin, "http://localhost:3773", "http://127.0.0.1:3773"].includes(event.origin)) return;
    removeEventListener("message", enableEnglish);
    const [runtime, catalog] = await Promise.all([
      import("/chronos-ui-english.mjs"), fetch("/chronos-ui-english.json").then(r => r.json()),
    ]);
    runtime.installEnglish(catalog);
  };
  addEventListener("message", enableEnglish);
}
