name: Chronos performance pair
on:
  workflow_call:
    inputs:
      pair:
        type: string
        required: true
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    permissions:
      contents: read
      actions: write
    outputs:
      pair: ${{ steps.builds.outputs.pair }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          sparse-checkout: chronos/scripts/bench
      - id: builds
        env:
          GH_TOKEN: ${{ github.token }}
          PAIR: ${{ inputs.pair }}
        run: node chronos/scripts/bench/guard-plan.mjs
  measure:
    strategy:
      fail-fast: false
      matrix:
        shard: [idle-ui, runtime, interface]
    name: ${{ matrix.shard }} / ${{ fromJSON(inputs.pair).head.ref }}
    needs: package
    runs-on: windows-2025
    timeout-minutes: 115
    env:
      BENCH_UI_INPUT_SAMPLES: '40'
      GUARD_SHARD: ${{ matrix.shard }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          sparse-checkout: chronos
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare exact Windows packages and pinned CLIs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PAIR: ${{ needs.package.outputs.pair }}
        run: ./chronos/scripts/bench/guard-run.ps1 -Stage prepare -Results "$env:RUNNER_TEMP/guard"
      - name: Measure all three paired rounds
        run: ./chronos/scripts/bench/guard-run.ps1 -Stage measure -Results "$env:RUNNER_TEMP/guard"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: samples-${{ fromJSON(inputs.pair).name }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/guard
          if-no-files-found: error
          retention-days: 2
  compare:
    needs: [package, measure]
    runs-on: ubuntu-24.04
    env:
      PAIR: ${{ needs.package.outputs.pair }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          sparse-checkout: chronos
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: samples-${{ fromJSON(inputs.pair).name }}-*
          path: ${{ runner.temp }}/samples
      - run: node chronos/scripts/bench/guard-shards.mjs "$RUNNER_TEMP/samples" "$RUNNER_TEMP/guard"
      - name: Enforce budget and publish the comparison
        run: node chronos/scripts/bench/guard-compare.mjs "$RUNNER_TEMP/guard"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: guard-${{ fromJSON(inputs.pair).name }}
          path: ${{ runner.temp }}/guard
          if-no-files-found: error
          retention-days: 14
