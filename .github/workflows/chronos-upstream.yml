name: T3 nightly compatibility report
on:
  schedule:
    - cron: "31 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chronos-upstream-report
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch the Chronos history and report scripts
        shell: bash
        run: |
          set -euo pipefail
          git init -q
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags origin "$GITHUB_SHA"
          git sparse-checkout set --cone chronos
          git checkout --detach FETCH_HEAD
      - name: Compare the published T3 nightly with the Chronos base
        shell: bash
        run: |
          set -euo pipefail
          upstream=https://github.com/pingdotgg/t3code.git
          base=$(node -p "require('./chronos/version.json').upstream")
          pinned=$(node -p "require('./chronos/version.json').upstreamCommit")
          git fetch --no-tags "$upstream" "refs/tags/v$base"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$pinned"
          git ls-remote --tags --refs --sort=-version:refname "$upstream" 'v*-nightly.*' > "$RUNNER_TEMP/nightlies"
          read -r sha ref < "$RUNNER_TEMP/nightlies"
          git fetch --no-tags "$upstream" "$ref"
          test "$(git rev-parse FETCH_HEAD)" = "$sha"
          echo "### ${ref#refs/tags/}" >> "$GITHUB_STEP_SUMMARY"
          node chronos/scripts/upstream-plan.mjs nightly FETCH_HEAD | tee "$RUNNER_TEMP/report"
          echo '~~~~text' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/report" >> "$GITHUB_STEP_SUMMARY"
          echo '~~~~' >> "$GITHUB_STEP_SUMMARY"
