# Chronos desktop builds (Windows x64 NSIS, macOS arm64 + x64 dmg/zip), unsigned.
#
# - push to main or workflow_dispatch: build and keep the installers as workflow artifacts.
# - tag chronos-v<version>: publish a GitHub Release with the tested installers and the
#   electron-updater feeds (nightly.yml, nightly-mac.yml).
#   The tag must match chronos/version.json (chronos/scripts/chronos-version.mjs).
#
# Follows upstream's release.yml / release-desktop.yml, minus signing, the CLI
# archives, Linux and Windows arm64. Windows is cross-built on Linux exactly as
# upstream does. See chronos/README.md.
name: Chronos desktop
run-name: ${{ inputs.perf_sha && format('Perf Windows {0}', inputs.perf_sha) || '' }}

on:
  workflow_dispatch:
    inputs:
      portable_windows:
        description: Also export the verified Windows installer payload as a portable ZIP for rehearsal
        type: boolean
        default: false
      perf_sha:
        description: Build only the Windows benchmark package from this immutable commit
        type: string
  push:
    branches:
      - main
    tags:
      - "chronos-v*"

permissions:
  contents: read

concurrency:
  group: chronos-desktop-${{ inputs.perf_sha || github.ref }}
  cancel-in-progress: false

env:
  # Public T3 Connect identifiers from .env.example ("the same public identifiers
  # baked into official release builds, not secrets").
  T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk
  T3CODE_CLERK_JWT_TEMPLATE: t3-relay
  T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: hzxSgY2cH10sDU2r
  T3CODE_RELAY_URL: https://relay.t3.codes
  # Release links in the web client point at Chronos releases.
  T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      desktop_matrix: ${{ steps.platforms.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
      upstream: ${{ steps.version.outputs.upstream }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.perf_sha }}
          sparse-checkout: chronos
      - name: Select desktop platforms
        id: platforms
        env:
          PERF_SHA: ${{ inputs.perf_sha }}
        run: |
          if [[ -n "$PERF_SHA" ]]; then
            [[ "$PERF_SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$PERF_SHA" && "$GITHUB_REF_TYPE" == branch ]] || exit 1
          fi
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const platforms = [
            { label: 'Windows x64', runner: 'ubuntu-24.04', platform: 'win', target: 'nsis', arch: 'x64', rust_target: 'x86_64-pc-windows-msvc' },
            { label: 'macOS arm64', runner: 'macos-26', platform: 'mac', target: 'dmg', arch: 'arm64', rust_target: 'aarch64-apple-darwin' },
            { label: 'macOS x64', runner: 'macos-26-intel', platform: 'mac', target: 'dmg', arch: 'x64', rust_target: 'x86_64-apple-darwin' },
          ];
          const include = platforms.filter(p => !process.env.PERF_SHA || p.platform === 'win');
          appendFileSync(process.env.GITHUB_OUTPUT, 'matrix=' + JSON.stringify({include}) + '\n');
          JS
      - name: Resolve Chronos version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          args=(--github-output)
          if [[ "$REF_TYPE" == "tag" ]]; then args+=(--check-tag "$REF_NAME"); fi
          node chronos/scripts/chronos-version.mjs "${args[@]}"

  bundle:
    if: github.ref_type != 'tag'
    name: Build JS bundle
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.perf_sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      # Server, web and CLI keep the upstream nightly version, so T3 Connect, the
      # background service and remote runtimes resolve real T3 releases. Only the
      # desktop app carries the Chronos version (--build-version below).
      - name: Align package versions to the upstream nightly
        run: node scripts/update-release-package-versions.ts "${{ needs.version.outputs.upstream }}"

      - name: Build JS bundle
        run: vp run build:desktop:bundle

      - name: Upload JS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  # Vite builds do not typecheck; this covers the packages Chronos patches.
  typecheck:
    if: github.ref_type != 'tag' && !inputs.perf_sha
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/contracts... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/shared... --filter=@t3tools/scripts...

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Typecheck
        run: vp run --filter @t3tools/contracts --filter @t3tools/shared --filter @t3tools/web --filter @t3tools/desktop --filter @t3tools/scripts typecheck

  cli:
    if: ${{ !inputs.perf_sha }}
    name: SSH CLI ${{ matrix.key }}
    needs: [version, bundle]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: linux-x64, runner: ubuntu-24.04, platform: linux, arch: x64 }
          - { key: linux-arm64, runner: ubuntu-24.04-arm, platform: linux, arch: arm64 }
          - { key: darwin-arm64, runner: macos-26, platform: mac, arch: arm64 }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/scripts...
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: js-bundle
          path: apps
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf libsecret-1-dev
      - name: Build native runner and archive
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          UPSTREAM: ${{ needs.version.outputs.upstream }}
        run: |
          set -euo pipefail
          node scripts/update-release-package-versions.ts "$UPSTREAM"
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml
          monitor="$RUNNER_TEMP/monitor/${{ matrix.key }}"
          mkdir -p "$monitor"
          cp native/resource-monitor/target/release/t3-resource-monitor "$monitor/"
          node apps/server/scripts/cli.ts build-exe --verbose
          node scripts/build-cli-archive.ts --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" \
            --version "$VERSION" --resource-monitor-dir "$RUNNER_TEMP/monitor" --output-dir release-cli
          node scripts/smoke-cli-archive.ts --archive "release-cli/t3-${VERSION}-${{ matrix.key }}.tar.gz" --expect-version "$UPSTREAM"
      - name: Exercise SSH archive installation and compare Linux CLIs
        if: matrix.key == 'linux-x64'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          UPSTREAM: ${{ needs.version.outputs.upstream }}
        run: |
          set -euo pipefail
          node chronos/scripts/bench/ssh-cli.mjs "$UPSTREAM" "$VERSION" release-cli/*.tar.gz "$RUNNER_TEMP/ssh-cli.json"
          cat "$RUNNER_TEMP/ssh-cli.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: chronos-cli-${{ matrix.key }}
          path: release-cli/*.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  desktop:
    name: Build ${{ matrix.label }}
    needs: [version, bundle]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.desktop_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.perf_sha }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor${{ matrix.platform == 'win' && '.exe' || '' }}
          key: resource-monitor-${{ matrix.rust_target }}-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Install cargo-xwin
        if: matrix.platform == 'win' && steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-xwin@0.23.1

      - name: Build resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        run: cargo ${{ matrix.platform == 'win' && 'xwin build' || 'build' }} --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "${{ matrix.rust_target }}"

      - name: Align package versions to the upstream nightly
        run: node scripts/update-release-package-versions.ts "${{ needs.version.outputs.upstream }}"

      - name: Download JS bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-bundle
          path: apps

      # The WSL backend runs the Linux T3 CLI inside the distro. Chronos embeds the
      # official archive of the upstream nightly it is based on (same as T3 Nightly).
      - name: Download upstream Linux CLI archive for WSL
        if: matrix.platform == 'win'
        env:
          UPSTREAM: ${{ needs.version.outputs.upstream }}
        run: |
          set -euo pipefail
          mkdir -p wsl-runtime
          base="https://github.com/pingdotgg/t3code/releases/download/v${UPSTREAM}"
          name="t3-${UPSTREAM}-linux-${{ matrix.arch }}.tar.gz"
          fetch=(curl -fsSL --retry 5 --retry-all-errors --connect-timeout 10)
          "${fetch[@]}" -o "wsl-runtime/$name" "$base/$name"
          "${fetch[@]}" -o wsl-runtime/SHA256SUMS "$base/SHA256SUMS"
          (cd wsl-runtime && grep " \*\?$name\$" SHA256SUMS | sha256sum -c -)

      # Signing is off on purpose: Chronos has no Apple Developer ID or Azure
      # Trusted Signing account. Windows SmartScreen and macOS Gatekeeper warn on
      # first launch; macOS updates go through the release page (see chronos/README.md).
      - name: Build desktop artifact
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: true
        run: |
          set -euo pipefail
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.version.outputs.version }}"
            --skip-build
            --verbose
          )
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            args+=(--wsl-runtime "$GITHUB_WORKSPACE"/wsl-runtime/t3-*-linux-${{ matrix.arch }}.tar.gz)
          fi
          vp run dist:desktop:artifact "${args[@]}"

      - name: Verify bundled Olympus services in the distributable
        shell: bash
        run: |
          set -euo pipefail
          stage=$(mktemp -d)
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            7z e -y "-o$stage" release/*.exe '-ir!app-*.7z' >/dev/null
            7z x -y "-o$stage" "$stage"/app-*.7z 'resources/chronos-services/*' 'resources/chronos-pc/*' >/dev/null
            resources="$stage/resources/chronos-services"
            for tool in agent-desktop.exe agent-browser.exe private-desktop.exe; do test -s "$stage/resources/chronos-pc/$tool"; done
          else
            unzip -q release/*.zip '*/Contents/Resources/chronos-services/*' '*/Contents/Resources/chronos-pc/*' -d "$stage"
            pc=$(find "$stage" -type d -name chronos-pc -print -quit)
            for tool in agent-desktop agent-desktop-macos-helper agent-browser; do test -x "$pc/$tool"; done
            resources=$(find "$stage" -type d -name chronos-services -print -quit)
          fi
          test -d "$resources"
          test -z "$(find "$resources" -name '*.test.mjs' -print -quit)"
          diff -qr -x '*.test.mjs' chronos/services "$resources"
          CHRONOS_TEST_RESOURCES="$resources" node --test chronos/scripts/smoke/services.test.mjs

      - name: Export portable Windows payload
        if: matrix.platform == 'win' && inputs.portable_windows
        run: |
          set -euo pipefail
          stage=$(mktemp -d)
          7z e -y "-o$stage" release/*.exe '-ir!app-*.7z' >/dev/null
          7z x -y "-o$stage/portable" "$stage"/app-*.7z >/dev/null
          test -s "$stage/portable/Chronos.exe"
          (cd "$stage/portable" && 7z a -tzip -mx=1 "$RUNNER_TEMP/chronos-portable.zip" . >/dev/null)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: matrix.platform == 'win' && inputs.portable_windows
        with:
          name: chronos-win-portable
          path: ${{ runner.temp }}/chronos-portable.zip
          retention-days: 7
          compression-level: 0

      - name: Verify macOS ad-hoc signature and ElectronAsarIntegrity
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          verify_bundle() {
            local app="$1"
            codesign --verify --deep --strict --verbose=2 "$app"
            local plist="$app/Contents/Info.plist"
            local asar="$app/Contents/Resources/app.asar"
            /usr/bin/plutil -lint "$plist"
            local expected actual
            expected=$(node -e 'console.log(require("./chronos/scripts/macos-after-pack.cjs").computeAsarHeaderHash(process.argv[1]))' "$asar")
            actual=$(/usr/libexec/PlistBuddy -c 'Print :ElectronAsarIntegrity:Resources/app.asar:hash' "$plist")
            test "$actual" = "$expected" || { echo "ElectronAsarIntegrity mismatch in $app: plist=$actual computed=$expected"; exit 1; }
          }
          zip_stage=$(mktemp -d)
          dmg_mount=$(mktemp -d)
          cleanup() {
            hdiutil detach "$dmg_mount" -force >/dev/null 2>&1 || true
            rm -rf "$zip_stage" "$dmg_mount"
          }
          trap cleanup EXIT
          ditto -x -k release/*.zip "$zip_stage"
          verify_bundle "$zip_stage/Chronos.app"
          hdiutil attach -nobrowse -readonly -mountpoint "$dmg_mount" release/*.dmg
          verify_bundle "$dmg_mount/Chronos.app"

      - name: Collect release assets
        env:
          PERF_SHA: ${{ inputs.perf_sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-publish
          for file in release/*.dmg release/*.zip release/*.exe release/*.blockmap release/*.yml; do
            [[ "$file" == */builder-debug.yml ]] && continue
            cp "$file" release-publish/
          done
          # electron-builder names both macOS feeds <channel>-mac.yml; the release
          # job merges the x64 one into the arm64 one.
          if [[ "${{ matrix.platform }}" == "mac" && "${{ matrix.arch }}" != "arm64" ]]; then
            for manifest in release-publish/*-mac.yml; do
              mv "$manifest" "${manifest%.yml}-${{ matrix.arch }}.yml"
            done
          fi
          if [[ -n "$PERF_SHA" ]]; then git rev-parse HEAD > release-publish/perf-source.txt; fi
          ls -la release-publish

      - name: Upload desktop artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chronos-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag' && !inputs.perf_sha && startsWith(github.ref_name, 'chronos-v')
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/scripts...

      - name: Locate the tested build of this commit
        id: verified
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          test "$head" = "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          runs="repos/$GITHUB_REPOSITORY/actions/workflows"
          checked=$(gh api "$runs/chronos-checks.yml/runs?head_sha=$head&status=success" --jq '.workflow_runs[0].id // empty')
          build=$(gh api "$runs/chronos-desktop.yml/runs?head_sha=$head&event=workflow_dispatch&status=success" --jq '.workflow_runs[0].id // empty')
          test -n "$checked" && test -n "$build" || { echo "A successful Chronos checks run and a manual desktop build are required for $head"; exit 1; }
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Download desktop artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ steps.verified.outputs.build }}
          github-token: ${{ github.token }}
          pattern: chronos-*
          path: release-assets
          merge-multiple: true

      - name: Merge macOS updater manifests
        run: |
          set -euo pipefail
          shopt -s nullglob
          ls -la release-assets
          # Windows ships x64 only, so only the macOS arm64/x64 feeds need merging.
          for x64 in release-assets/*-mac-x64.yml; do
            arm64="${x64%-x64.yml}.yml"
            node scripts/merge-update-manifests.ts --platform mac "$arm64" "$x64" "$arm64"
            rm "$x64"
          done
          cat release-assets/*.yml

      - name: Prepare permanent installer links
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          node chronos/scripts/verify-release.mjs release-assets "$VERSION"
          node chronos/scripts/delivery/windows-feed.mjs release-assets/nightly.yml "$VERSION"
          cd release-assets
          cp "Chronos-${VERSION}-x64.exe" Chronos-Setup-x64.exe
          cp "Chronos-${VERSION}-arm64.dmg" Chronos-mac-arm64.dmg
          cp "Chronos-${VERSION}-x64.dmg" Chronos-mac-x64.dmg
          sha256sum Chronos-Setup-x64.exe Chronos-mac-{arm64,x64}.dmg "t3-${VERSION}-"{linux-x64,linux-arm64,darwin-arm64}.tar.gz > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          UPSTREAM: ${{ needs.version.outputs.upstream }}
        run: |
          set -euo pipefail
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          notes=$(printf '%s\n' \
            "На базе исходного кода T3 Code [${UPSTREAM}](https://github.com/pingdotgg/t3code/releases/tag/v${UPSTREAM}). Chronos — неофициальный форк, не связан с T3 Tools, Inc." \
            "" \
            "| Платформа | Установщик |" \
            "|---|---|" \
            "| Windows x64 | [Chronos-Setup-x64.exe](${base}/Chronos-Setup-x64.exe) |" \
            "| macOS Apple Silicon | [Chronos-mac-arm64.dmg](${base}/Chronos-mac-arm64.dmg) |" \
            "| macOS Intel | [Chronos-mac-x64.dmg](${base}/Chronos-mac-x64.dmg) |" \
            "" \
            "Сборки не подписаны сертификатом разработчика (macOS имеет ad-hoc подпись): Windows — «Подробнее» → «Выполнить в любом случае»; macOS — перетащите \`Chronos.app\` в «Программы» и перед первым запуском снимите карантин в Терминале: \`xattr -cr /Applications/Chronos.app\`. На macOS обновления устанавливаются вручную из нового \`.dmg\`. Контрольные суммы — \`SHA256SUMS\`. Файлы \`.blockmap\`, \`.zip\` и \`*.yml\` нужны проверке и автообновлению, качать их не нужно. Chronos ставится рядом с T3 Code и хранит данные отдельно (\`~/.chronos\`)." \
            "" \
            "---" \
            "" \
            "Built from the T3 Code ${UPSTREAM} source. Chronos is an unofficial fork, not affiliated with T3 Tools, Inc. Installers are not signed with a developer certificate (macOS uses an ad-hoc signature). SmartScreen: More info → Run anyway; macOS: drag \`Chronos.app\` to Applications, then remove quarantine before first launch with \`xattr -cr /Applications/Chronos.app\`. macOS updates are installed manually from the new \`.dmg\`. Checksums: \`SHA256SUMS\`. Installs side by side with T3 Code; data lives in \`~/.chronos\`.")
          gh release create "$TAG" release-assets/Chronos-* release-assets/nightly*.yml release-assets/t3-*.tar.gz release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Chronos ${VERSION}" \
            --notes "$notes" \
            --latest
