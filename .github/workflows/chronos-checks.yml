# Chronos checks: types, Russian catalogs, web/desktop unit suites and focused server regressions.
name: Chronos checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/**"
      - "upstream-sync/**"

permissions:
  contents: read

concurrency:
  group: chronos-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Russian catalog (coverage, placeholders)
        run: node chronos/scripts/l10n-check.mjs --min 95

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/shared... --filter=@t3tools/scripts...

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Typecheck
        run: vp run --filter @t3tools/shared --filter @t3tools/web --filter @t3tools/desktop --filter @t3tools/scripts typecheck

      - name: Linux native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Shared release and theme regression tests
        working-directory: packages/shared
        run: vp test run src/cliRelease.test.ts src/themeCss.test.ts

      - name: Web unit tests
        working-directory: apps/web
        run: vp test run --project unit

      - name: Desktop unit tests
        working-directory: apps/desktop
        run: vp test run

  server:
    name: Server integration regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3...
      - name: Auth, migrations, projection index and WSL keep awake
        working-directory: apps/server
        run: vp test run src/background/KeepAwake.test.ts src/auth/RpcAuthorization.test.ts src/auth/EnvironmentAuth.test.ts src/orchestration-v2/ProjectionStore.test.ts src/persistence/reconcileV2PreviewMigration.test.ts
