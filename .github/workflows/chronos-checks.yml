# Chronos checks: version config, upstream-plan, types, web/desktop unit suites and focused server regressions.
name: Chronos checks

on:
  workflow_dispatch:
    inputs:
      ui_builds:
        description: "Optional packaged UI benchmark: comma-separated Chronos desktop run IDs"
        required: false
        type: string
      ui_large_sidebar:
        description: "Also measure a 1,000-thread sidebar without active agents"
        type: boolean
        default: false
      bench_suite:
        description: "Focused same-VM package comparison (three alternating passes)"
        type: choice
        default: full
        options: [full, scroll, wheel, startup, renderer, server, idle, ssh, ram, acp-bridge, claude-runtime, claude-idle, acp-idle]
  push:
    branches:
      - main
      - "feature/**"
      - "upstream-sync/**"

permissions:
  contents: read

concurrency:
  group: chronos-checks-${{ github.ref }}-${{ inputs.ui_builds || 'checks' }}-${{ inputs.bench_suite || 'full' }}
  cancel-in-progress: true

jobs:
  checks:
    if: (inputs.bench_suite || 'full') == 'full'
    name: Typecheck and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Validate Chronos skills and exercise profile synchronization
        run: |
          python -m venv "$RUNNER_TEMP/chronos-skills-env"
          "$RUNNER_TEMP/chronos-skills-env/bin/pip" install --quiet PyYAML==6.0.3 Markdown==3.8.2
          "$RUNNER_TEMP/chronos-skills-env/bin/python" chronos/scripts/validate-skills.py
          "$RUNNER_TEMP/chronos-skills-env/bin/python" chronos/scripts/test-validate-skills.py
          node --test chronos/scripts/sync-skills.test.mjs

      - name: Validate Chronos version metadata
        run: node chronos/scripts/chronos-version.mjs

      - name: Exercise token-free ACP benchmark fixture
        run: node --test chronos/scripts/bench/agent.test.mjs

      - name: Computer control permissions and emergency stop
        run: node --test chronos/pc-control/controller.test.cjs

      - name: macOS ASAR integrity and Mach-O packaging helper
        run: node --test chronos/scripts/macos-after-pack.test.mjs

      - name: Preview feature changes and upstream integration in a temporary repository
        run: node --test chronos/scripts/upstream-plan.test.mjs

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/contracts... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/shared... --filter=@t3tools/scripts... --filter=@t3tools/oxlint-plugin-t3code...

      - name: Exercise the Windows differential updater
        run: node --test chronos/scripts/delivery/*.test.mjs

      - name: Olympus feature gates and chat preferences
        run: node --test chronos/scripts/olympus-settings.test.mjs chronos/scripts/provider-copy.test.mjs chronos/scripts/smoke/olympus-theme.test.mjs

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Bundled Electron SQLite and isolated Olympus services
        working-directory: apps/desktop
        env:
          ELECTRON_RUN_AS_NODE: "1"
        run: |
          runtime=$(node -p "require('electron')")
          "$runtime" -e "const db=new (require('node:sqlite').DatabaseSync)(':memory:'); console.log(process.versions.electron, process.versions.node, db.prepare('SELECT 1 AS ok').get()); db.close()"
          "$runtime" --test ../../chronos/scripts/smoke/services.test.mjs ../../chronos/scripts/smoke/service-host.test.mjs
          "$runtime" --test ../../chronos/services/mcp-manager/worker.test.mjs
          "$runtime" --test ../../chronos/services/artifacts/*.test.mjs

      - name: Chronos desktop module lint
        run: vp lint apps/desktop/src/chronos

      - name: Typecheck
        run: vp run --filter @t3tools/contracts --filter @t3tools/shared --filter @t3tools/web --filter @t3tools/desktop --filter @t3tools/scripts typecheck

      - name: Linux native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Shared release, theme, markdown, sqlite and tracing regressions
        working-directory: packages/shared
        run: vp test run src/cliRelease.test.ts src/themeCss.test.ts src/markdownPipeline.test.ts src/observability.test.ts src/nodeSqliteClient.test.ts

      - name: Shell reducer and positional index
        working-directory: packages/client-runtime
        run: vp test run src/chronos/threadPositions.test.ts src/state/shellReducer.test.ts src/state/threadShell.test.ts src/state/threads-atoms.test.ts

      - name: Web unit tests
        working-directory: apps/web
        run: vp test run --project unit

      - name: Backported thread navigation browser regressions
        if: inputs.ui_builds != ''
        working-directory: apps/web
        run: |
          pnpm exec playwright install --with-deps chromium
          vp test run --project browser src/components/ComposerPromptEditorTiptap.input.browser.test.tsx src/components/ui/tooltip.browser.test.tsx src/chronos/perf/SidebarCardContents.browser.test.tsx -t 'composer context undo lifetime|closes the shared tooltip when its open trigger is removed|retains focused sidebar controls'
          vp test run --project browser src/components/chat/QueuedRunsControl.browser.test.tsx
          vp test run --project browser src/lib/openPullRequestLink.browser.test.tsx

      - name: Trello card link recognition
        working-directory: packages/client-runtime
        run: vp test run src/issueLinks.test.ts

      - name: SSH source switching and ownership
        working-directory: packages/ssh
        run: vp test run src/tunnel.test.ts -t 'archive launch script|declined desktop confirmation'

      - name: Desktop unit tests
        working-directory: apps/desktop
        run: vp test run

  server:
    if: (inputs.bench_suite || 'full') == 'full'
    name: Server integration regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          # The server tsconfig includes ../../scripts/lib, whose imports resolve from @t3tools/scripts.
          install-args: --filter=t3... --filter=@t3tools/scripts...
      - name: Server typecheck
        id: server_types
        run: vp run --filter t3 typecheck
      - name: Diagnose provider and server type errors at their source
        if: failure() && steps.server_types.outcome == 'failure'
        run: |
          for package in packages/provider-core packages/provider-acp packages/provider-opencode apps/server; do
            echo "::group::TypeScript diagnostics for $package"
            pnpm exec effect-tsgo tsc --noEmit --pretty false -p "$package/tsconfig.json" || true
            echo "::endgroup::"
          done
      - name: Auth, migrations, projection index and WSL keep awake
        working-directory: apps/server
        run: vp test run src/background/KeepAwake.test.ts src/auth/RpcAuthorization.test.ts src/auth/EnvironmentAuth.test.ts src/orchestration-v2/ProjectionStore.test.ts src/persistence/reconcileV2PreviewMigration.test.ts
      - name: Scheduled runs, terminal shells and agent orchestration
        working-directory: apps/server
        run: |
          vp test run src/provider/acp/AntigravityTurnOutcome.test.ts src/orchestration-v2/UsageLimitRecoveryWorker.test.ts
          vp test run src/mcp/OrchestratorMcpToolkit.integration.test.ts -t 'reports distinct child results'
          vp test run src/scheduledTasks/ScheduledTaskService.schedule.test.ts
          vp test run src/peer/RemoteDelegation.test.ts -t 'a task naming another driver there'
          vp test run src/terminal/Manager.test.ts -t 'opens the available Windows shell'
          vp test run src/mcp/OrchestratorMcpService.test.ts -t 'inherits delegated options|prepares a worktree in the selected project'

      - name: Claude and ACP idle unload and native resume
        working-directory: apps/server
        run: |
          vp test run src/chronos/claudeProcessGuard.test.ts src/orchestration-v2/ProviderSessionManager.test.ts
          vp test run src/orchestration-v2/Adapters/AcpAdapterV2.test.ts -t 'loads the persisted ACP session during startup'
          vp test run src/orchestration-v2/Adapters/ClaudeAdapterV2.test.ts -t 'resumes the native session on a fresh session instance|resumes an imported native session|resumes the session a /clear selected'
      - name: Antigravity background work and runtime policy (offline ACP)
        working-directory: apps/server
        run: vp test run src/orchestration-v2/Adapters/AntigravityAdapterV2.test.ts src/provider/Drivers/AntigravityDriver.test.ts src/provider/antigravityAuthSupport.test.ts
      - name: Provider access modes and command approvals (offline)
        working-directory: apps/server
        run: |
          vp test run src/orchestration-v2/ProviderSessionTransitionPolicy.test.ts
          vp test run src/orchestration-v2/Adapters/CodexAdapterV2.test.ts -t 'derives concrete Codex turn policies|full access asks about|Codex file-change approval paths|handles MCP access approvals'
          vp test run src/orchestration-v2/Adapters/ClaudeAdapterV2.test.ts -t 'maps default full-access policy|keeps approval-required mode interactive|marks asks that full access|adds nothing to ordinary approvals|asks before restricted Full access'
          vp test run src/orchestration-v2/Adapters/OpenCode2AdapterV2.test.ts src/orchestration-v2/Adapters/AcpRegistryAdapterV2.test.ts src/orchestration-v2/Adapters/KiroAdapterV2.test.ts src/orchestration-v2/Adapters/GrokAdapterV2.test.ts src/orchestration-v2/Adapters/FxAdapterV2.test.ts -t 'permission|approval|runtime mode|autopilot|[Ff]ull access'
          (cd ../../packages/provider-acp && vp test run src/server/clientPolicy.test.ts)
          (cd ../../packages/provider-opencode && vp test run src/server/adapter.test.ts -t 'maps runtime modes|enforces non-interactive|identified local tool')
          (cd ../../packages/provider-muse && vp test run src/server/adapter.test.ts src/server/sdk.test.ts src/server/protocol.test.ts)
          (cd ../../packages/provider-pi && vp test run src/server/mcpExtensionSource.test.ts)
          (cd ../../packages/provider-cursor && vp test run src/server/adapter.test.ts -t 'maps runtime modes to the SDK sandbox')
      - name: Olympus provider, quota and usage regressions
        working-directory: apps/server
        run: vp test run src/provider/acp/AntigravityChildWork.test.ts src/provider/acp/AntigravityProtocol.test.ts src/provider/AntigravityProvider.test.ts src/provider/antigravityUsageLimits.test.ts src/usage/UsageService.test.ts src/usage/usagePricing.test.ts
      - name: Trello REST, issue connections and MCP tools
        working-directory: apps/server
        run: vp test run src/chronos/issue-trello/driver.test.ts src/issue/IssueTrackerConnections.test.ts src/mcp/toolkits/issues/handlers.test.ts
      - name: Native Rust ACP MCP bridge unit and loopback tests
        run: |
          cargo test --locked --manifest-path native/resource-monitor/Cargo.toml
          cargo build --locked --manifest-path native/resource-monitor/Cargo.toml
      - name: Chronos performance regressions
        working-directory: apps/server
        env:
          CHRONOS_TEST_NATIVE_BRIDGE: ${{ github.workspace }}/native/resource-monitor/target/debug/t3-resource-monitor
        run: |
          (cd ../../packages/provider-acp && vp test run src/server/nativeAcpMcpBridge.test.ts)
          vp test run src/background/KeepAwake.test.ts src/persistence/DatabaseStorage.test.ts src/chronos/perf src/orchestration-v2/RunExecutionService.test.ts src/orchestration-v2/ProviderCommitBatch.test.ts src/orchestration-v2/ProviderSessionManager.test.ts src/orchestration-v2/LiveStreamBudget.test.ts src/process/SpawnWorker.test.ts src/mcp/AcpMcpStdioBridge.test.ts src/workspace/WorkspaceSearchIndex.test.ts
      - name: First use of server Markdown processors
        working-directory: apps/server
        run: |
          vp test run src/guest/guestAttachments.test.ts src/orchestration-v2/ThreadFind.test.ts
          vp test run src/orchestration-v2/Adapters/CodexAdapterV2.test.ts -t 'projects generated images'

      - name: OpenCode and OpenRouter usage records
        working-directory: packages/provider-opencode
        run: vp test run src/server/usage.test.ts

  ssh-pair:
    if: inputs.bench_suite == 'ssh'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          sparse-checkout: chronos
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Compare two packaged SSH servers on the same Linux VM
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILDS: ${{ inputs.ui_builds }}
        run: |
          set -euo pipefail
          [[ "$BUILDS" =~ ^[0-9]+,[0-9]+$ ]]
          IFS=, read -r base head <<< "$BUILDS"
          out="$RUNNER_TEMP/ssh-results"
          mkdir -p "$out"
          for side in base head; do
            run="${!side}"
            dir="$RUNNER_TEMP/cli-$side"
            mkdir -p "$dir/pkg"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '{id,head_sha,path}' > "$out/$side.json"
            jq -e '.path == ".github/workflows/chronos-desktop.yml"' "$out/$side.json"
            gh run download "$run" -R "$GITHUB_REPOSITORY" -n chronos-cli-linux-x64 -D "$dir"
            tar -xzf "$dir"/*.tar.gz --strip-components=1 -C "$dir/pkg"
          done
          upstream=$(node -p 'require("./chronos/version.json").upstream')
          node chronos/scripts/bench/ssh-cli.mjs --pair "$upstream" "$RUNNER_TEMP/cli-base/pkg/t3" "$RUNNER_TEMP/cli-head/pkg/t3" "$out/runs.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ssh-pair
          path: ${{ runner.temp }}/ssh-results/

  packaged-ui:
    if: inputs.ui_builds != '' && inputs.bench_suite != 'ssh'
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          sparse-checkout: chronos
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Compare Windows packages on the same machine
        if: (inputs.bench_suite || 'full') == 'full'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILDS: ${{ inputs.ui_builds }}
          LARGE_SIDEBAR: ${{ inputs.ui_large_sidebar }}
        run: |
          $ErrorActionPreference = 'Stop'
          $results = Join-Path $env:RUNNER_TEMP 'ui-results'
          $errors = @()
          foreach ($build in $env:BUILDS.Split(',')) {
            if ($build -notmatch '^\d+$') { throw 'Expected a desktop run ID' }
            $out = Join-Path $results $build
            New-Item -ItemType Directory -Force $out | Out-Null
            $dest = Join-Path $env:RUNNER_TEMP "ui-package-$build"
            ./chronos/scripts/bench/unpack.ps1 -Run $build -Destination $dest
            node chronos/scripts/bench/ui.mjs desktop "$dest/pkg" 0 "$out/smoke" smoke
            if ($LASTEXITCODE) { $errors += "Smoke $build" }
            foreach ($n in 0,8,16) {
              node chronos/scripts/bench/ui.mjs desktop "$dest/pkg" $n "$out/$n.json"
              if ($LASTEXITCODE) { $errors += "UI $build N=$n" }
            }
            if ($env:LARGE_SIDEBAR -eq 'true') {
              $env:BENCH_UI_ROWS = '1000'
              node chronos/scripts/bench/ui.mjs desktop "$dest/pkg" 0 "$out/1000-rows.json"
              if ($LASTEXITCODE) { $errors += "UI $build 1000 rows" }
              Remove-Item Env:BENCH_UI_ROWS
            }
          }
          if ($errors.Count) { throw ($errors -join ", ") }
      - name: Compare focused workloads on the same Windows VM
        if: inputs.bench_suite != '' && inputs.bench_suite != 'full'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILDS: ${{ inputs.ui_builds }}
          SUITE: ${{ inputs.bench_suite }}
        run: ./chronos/scripts/bench/compare.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: packaged-ui
          path: ${{ runner.temp }}/ui-results/
          retention-days: 14
