name: Chronos artifact hosts
on:
  push:
    branches: [feature/artifacts]
    paths:
      - native/artifact-host/**
      - chronos/scripts/bench/artifact-*
      - .github/workflows/chronos-artifact-hosts.yml
permissions:
  contents: read
jobs:
  compare:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build WebView2 prototype
        run: cargo build --locked --release --manifest-path native/artifact-host/Cargo.toml
      - name: Install matching Electron in scratch directory
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).dependencies.electron
          curl.exe -fsSL --retry 3 "https://github.com/electron/electron/releases/download/v$version/electron-v$version-win32-x64.zip" -o "$env:RUNNER_TEMP/electron.zip"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP/electron.zip" -DestinationPath "$env:RUNNER_TEMP/engine"
      - name: Compare cold process trees and first contentful paint
        shell: pwsh
        run: |
          node chronos/scripts/bench/artifact-hosts.mjs "$env:RUNNER_TEMP/engine/electron.exe" "$pwd/native/artifact-host/target/release/chronos-artifact-host.exe" "$env:RUNNER_TEMP/hosts.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: host-measurements
          path: ${{ runner.temp }}/hosts.json
