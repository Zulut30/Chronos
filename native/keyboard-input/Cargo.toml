[package]
name = "chronos-keyboard"
version = "0.1.0"
edition = "2021"
publish = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Input", "Win32_UI_WindowsAndMessaging"] }
sha2 = "0.10"

[profile.release]
panic = "abort"
strip = true
lto = true
